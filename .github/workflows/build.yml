name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Windows only, and not a matrix: the projects target net8.0-windows and use WPF, so there is
    # nothing to gain from pretending otherwise.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

      # Proves the icon in the repository still matches the geometry that generates it. A change to
      # FateMark.cs that nobody regenerated would otherwise ship a stale icon.
      - name: Check the brand mark is up to date
        run: |
          dotnet run --project build/FateIconGen --configuration Release -- "${{ github.workspace }}"
          git diff --exit-code -- src/FateTakesYouHome/Assets/Icons
        shell: pwsh

  package:
    needs: build
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      # The extensions must be pinned to the same version as the toolset. Unpinned, "extension add"
      # takes the latest published — WiX 7 extensions against a WiX 5 toolset, which fails with
      # "WIX6101: Could not find expected package root folder wixext5" and a non-zero exit.
      - name: Install the WiX toolset
        env:
          WIX_VERSION: '5.0.2'
        run: |
          dotnet tool install --global wix --version $env:WIX_VERSION
          wix extension add -g WixToolset.UI.wixext/$env:WIX_VERSION
          wix extension add -g WixToolset.Util.wixext/$env:WIX_VERSION
        shell: pwsh

      - name: Publish and package
        run: ./build/publish.ps1
        shell: pwsh

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: fate-takes-you-home
          path: |
            artifacts/*.msi
            artifacts/*.zip
          if-no-files-found: error
          retention-days: 14

  # Only a tag publishes, and it publishes the artifacts the package job already built rather than
  # rebuilding them — so what a release carries is byte for byte what CI tested.
  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: fate-takes-you-home
          path: artifacts

      # The notes are the CHANGELOG's own section for this version. One source of truth means the
      # release page and the file cannot end up describing the same release differently.
      - name: Assemble the release notes
        run: |
          version="${GITHUB_REF_NAME#v}"

          # Prefix matching rather than a regex: the heading is "## [0.3.1]", and building that
          # into a pattern turns the brackets into a character class unless they are escaped
          # through both the shell and awk, which is a silent no-match when it goes wrong.
          awk -v head="## [$version]" '
            index($0, head) == 1        { inside = 1; next }
            inside && index($0, "## [") == 1 { exit }
            inside                      { print }
          ' CHANGELOG.md > notes.md

          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for $version, so there are no notes to publish." >&2
            exit 1
          fi

          cat >> notes.md <<'NOTES'

          ## Install

          Run the MSI. It upgrades an existing install in place, keeping your pins, theme and
          token. The portable zip needs nothing installed — unzip and run.

          The MSI is unsigned, so SmartScreen will show its warning on first run.
          NOTES

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Fate Takes You Home ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            artifacts/*.msi artifacts/*.zip
