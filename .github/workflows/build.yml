name: Build

# No tag trigger. A release is a commit on main that moves VersionPrefix on: the release job below
# tags it and publishes it, so there is no tag to push, and no way for a tag to disagree with the
# version inside the installer.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Works out whether this commit is a release, and fails on a version bump that could not be
  # released cleanly: no changelog section, not newer than the latest release, a pre-release
  # suffix the MSI would drop, a tag already on another commit. On a pull request that means the
  # problem shows before the merge rather than as a failed release after it.
  version:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.plan.outputs.version }}
      release: ${{ steps.plan.outputs.release }}

    steps:
      - uses: actions/checkout@v7

      - name: Work out whether this is a release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./build/release.ps1 -Plan
        shell: pwsh

  build:
    # Windows only, and not a matrix: the projects target net8.0-windows and use WPF, so there is
    # nothing to gain from pretending otherwise.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

      # Proves the icon in the repository still matches the geometry that generates it. A change to
      # FateMark.cs that nobody regenerated would otherwise ship a stale icon.
      - name: Check the brand mark is up to date
        run: |
          dotnet run --project build/FateIconGen --configuration Release -- "${{ github.workspace }}"
          git diff --exit-code -- src/FateTakesYouHome/Assets/Icons
        shell: pwsh

  package:
    needs: build
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      # The extensions must be pinned to the same version as the toolset. Unpinned, "extension add"
      # takes the latest published: WiX 7 extensions against a WiX 5 toolset, which fails with
      # "WIX6101: Could not find expected package root folder wixext5" and a non-zero exit.
      - name: Install the WiX toolset
        env:
          WIX_VERSION: '5.0.2'
        run: |
          dotnet tool install --global wix --version $env:WIX_VERSION
          wix extension add -g WixToolset.UI.wixext/$env:WIX_VERSION
          wix extension add -g WixToolset.Util.wixext/$env:WIX_VERSION
        shell: pwsh

      - name: Publish and package
        run: ./build/publish.ps1
        shell: pwsh

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: fate-takes-you-home
          path: |
            artifacts/*.msi
            artifacts/*.zip
          if-no-files-found: error
          retention-days: 14

  # Publishes the artifacts the package job already built rather than rebuilding them, so what a
  # release carries is byte for byte what CI tested. Runs only on main, and only when the version
  # job found VersionPrefix unreleased; every other commit on main ships with the next bump.
  release:
    needs: [version, package]
    if: needs.version.outputs.release == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    # One at a time, never cancelled. Two pushes close together can both find the same version
    # unreleased; the second waits, looks again, and finds it published.
    concurrency:
      group: release
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: fate-takes-you-home
          path: artifacts

      # The notes are the CHANGELOG's own section for this version. One source of truth means the
      # release page and the file cannot end up describing the same release differently. The
      # script checks everything the version job did again first, then tags this commit.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./build/release.ps1 -Publish -Artifacts artifacts
        shell: pwsh
