version: 2

updates:
  # The actions are the half of the build most likely to break without anything here changing: a
  # runtime deprecation or a major that moved on takes the workflow red on its own schedule, not
  # ours. This repository has already lost two runs to exactly that.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    cooldown:
      # Only default-days here: the per-bump keys (semver-major-days and friends) are rejected for
      # github-actions, which Dependabot does not treat as a SemVer ecosystem.
      default-days: 7
    groups:
      # Four actions across three jobs. Bumping them one pull request at a time means four CI runs
      # to learn one thing.
      actions:
        patterns:
          - "*"

  # Versions are managed centrally in Directory.Packages.props, which Dependabot reads.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    # A package published an hour ago has been read by nobody. Waiting means the obvious breakage
    # is somebody else's pull request. This delays version updates only; security updates ignore
    # cooldown entirely, which is the whole point of having both.
    cooldown:
      default-days: 7
      semver-major-days: 21
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      # One pull request rather than three. These move together and are exercised by the same
      # "dotnet test", so reviewing them apart is work without a reader.
      test-stack:
        patterns:
          - xunit*
          - Microsoft.NET.Test.Sdk
      # Every other minor or patch version update, in one pull request a month. Majors stay
      # ungrouped so each one is reviewed on its own.
      nuget-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      # A vulnerability rarely arrives alone, and when several land at once the useful review is
      # of the set. Ungrouped, a bad week is one pull request per advisory.
      security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # .NET 10 is the LTS this targets on purpose; a major bump is a decision, not an update.
      - dependency-name: Microsoft.Extensions.DependencyInjection*
        update-types:
          - version-update:semver-major

# Deliberately not watched: dotnet-sdk. global.json pins 10.0.404 with rollForward latestFeature,
# which is a floor rather than a choice of SDK: any later 10.0 SDK satisfies it, and CI installs the
# newest 10.0.x regardless. The floor exists because a self-contained publish bundles the runtime
# patch its SDK shipped with (10.0.404 carries runtime 10.0.15), so it is what stops a build on an
# older SDK from shipping a runtime with known vulnerabilities. Raise it by hand when a .NET patch
# fixes a security issue.
